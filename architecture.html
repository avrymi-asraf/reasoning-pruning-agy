 benchmark sample", "details": "load_benchmark_questions streams one real question + gold answer (curated fallback when offline)."}, {"order": 3, "node": "generation", "action": "Run multi-depth rollout", "details": "rollout_pruning loops generate_trace -> grow pruned prefix -> recurse to --max-depth; computes compression_ratio from original vs final step counts."}, {"order": 4, "node": "decision", "action": "Audit for first safe skip", "details": "find_first_skip sends indexed steps + rubric to D; validates JSON indices, blocks full-trace skips, returns PruneDecision with reason."}, {"order": 5, "node": "visualizer", "action": "Render colored diff", "details": "on_step callback prints a Rich panel per depth (green prefix / struck-through PRUNED / cyan target); CLI prints compression summary."}]}, {"id": "notebook-research-lab", "name": "Interactive Research Lab (Colab)", "description": "Notebook-driven exploration across the full reasoning spectrum, stage by stage", "steps": [{"order": 1, "node": "explore-notebook", "action": "Bootstrap environment", "details": "Detects Colab vs local, installs deps, imports the library as `rp`."}, {"order": 2, "node": "package-api", "action": "Surface composable tools", "details": "Package import triggers init_environment(); all tools available as rp.*."}, {"order": 3, "node": "dataset-tools", "action": "Load reasoning spectrum", "details": "load_spectrum_benchmarks streams 6 benchmark families: math, science, commonsense, multi-hop, extractive QA."}, {"order": 4, "node": "generation", "action": "Generate live traces", "details": "generate_trace produces ReasoningTrace objects; rollout_pruning recurses multi-depth on complex problems."}, {"order": 5, "node": "decision", "action": "Overthinking audit", "details": "find_first_skip identifies the first redundant span with a written justification."}, {"order": 6, "node": "visualizer", "action": "Inspect diffs in-notebook", "details": "render_trace_diff(as_html=True) displays annotated diffs; build_pt_dataset output validated against schema constraints."}]}, {"id": "pt-dataset-build-and-publish", "name": "PT Dataset Build & Publish (CLI)", "description": "`rp datagen build` \u2014 turn benchmark questions into a versioned Hugging Face training dataset", "steps": [{"order": 1, "node": "cli", "action": "Dispatch datagen build", "details": "Resolves --dataset ('gsm8k' or 'spectrum'), --workers, --max-depth, optional --push-to-hf repo id."}, {"order": 2, "node": "dataset-tools", "action": "Ingest source questions", "details": "Benchmark loaders normalize multiple-choice options, contexts, and ground truths into uniform question dicts."}, {"order": 3, "node": "generation", "action": "Parallel pruning rollouts", "details": "ThreadPoolExecutor runs rollout_pruning per question; provenance metadata (category, source_dataset, ground_truth) injected into transitions."}, {"order": 4, "node": "decision", "action": "Produce skip labels", "details": "Each depth yields a TransitionExample: input_x (question + useful prefix) -> target_y (next useful step), plus skipped_steps and skip_reason."}, {"order": 5, "node": "local-artifacts", "action": "Persist locally", "details": "Dataset saved as Arrow files under ./data/rp_dataset."}, {"order": 6, "node": "hub-sync", "action": "Upload with lineage", "details": "push_dataset_to_hf computes depth breakdown and uploads an auto-generated Dataset Card."}, {"order": 7, "node": "hf-hub-datasets", "action": "Published dataset repo", "details": "Versioned PT dataset goes live on the Hub (e.g. user/rp-gsm8k-qwen1.5b-v1)."}]}, {"id": "qlora-finetuning", "name": "QLoRA Fine-Tuning (GPU)", "description": "`rp train` \u2014 compress G into G' via SFT on pruning transitions", "steps": [{"order": 1, "node": "cli", "action": "Dispatch rp train", "details": "Forwards --epochs, --batch-size, --lr, --lora-r, --report-to to the trainer."}, {"order": 2, "node": "training", "action": "Load PT data + quantize base", "details": "Resolves local Arrow folder or HF repo for the dataset; loads AutoModelForCausalLM with NF4 BitsAndBytesConfig (4-bit, double quant)."}, {"order": 3, "node": "hf-hub-models", "action": "Fetch base checkpoint", "details": "Downloads e.g. Qwen/Qwen2.5-1.5B-Instruct weights and tokenizer."}, {"order": 4, "node": "training", "action": "SFT on x->y transitions", "details": "TRL SFTTrainer formats '{input_x}\\n\\n[Next Step]:\\n{target_y}'; LoRA r=16 targets attention + MLP projections; paged_adamw_8bit optimizer."}, {"order": 5, "node": "local-artifacts", "action": "Write adapter checkpoint", "details": "trainer.model.save_pretrained -> ./checkpoints/rp_model/final_adapter (+ tokenizer)."}, {"order": 6, "node": "hub-sync", "action": "Publish pruned model", "details": "push_model_to_hf uploads the adapter folder and writes a lineage Model Card (base model, method, eval metrics)."}, {"order": 7, "node": "hf-hub-models", "action": "Release G'", "details": "Pruned-model repo live on the Hub (e.g. user/qwen1.5b-rp-v1)."}]}, {"id": "base-vs-pruned-evaluation", "name": "Base vs Pruned Evaluation (CLI)", "description": "`rp eval` \u2014 verify compression did not sacrifice accuracy", "steps": [{"order": 1, "node": "cli", "action": "Dispatch rp eval", "details": "Takes base vs pruned identifiers, benchmark name, --max-samples."}, {"order": 2, "node": "evaluation", "action": "Load benchmark + orchestrate", "details": "datasets.load_dataset(benchmark, split='test') supplies questions and gold answers; loops samples with tqdm."}, {"order": 3, "node": "generation", "action": "Dual generation", "details": "generate_trace called once per model per question; token counts captured from usage metadata."}, {"order": 4, "node": "llm-providers", "action": "Serve completions", "details": "Both G (verbose baseline) and G' (pruned) routed through LiteLLM."}, {"order": 5, "node": "visualizer", "action": "Report comparison", "details": "Console metrics table; render_comparison renders side-by-side cards; token savings % and accuracy delta summarized."}]}, {"id": "gradio-live-playground", "name": "Live Gradio Playground", "description": "`rp view --share` \u2014 interactive browser dashboard for pruning demos", "steps": [{"order": 1, "node": "cli", "action": "Launch viewer", "details": "`rp view` optionally loads a PT dataset before starting the server; --share exposes a public URL (Colab-friendly)."}, {"order": 2, "node": "dataset-tools", "action": "Provide browsing data", "details": "load_pt_dataset resolves a local Arrow folder or Hub repo for the Dataset Browser tab."}, {"order": 3, "node": "visualizer", "action": "Serve Gradio dashboard", "details": "Tabs: Live Pruning Playground (question input, model dropdowns, depth slider) and Dataset Browser (JSON inspector)."}, {"order": 4, "node": "generation", "action": "On-demand rollout", "details": "Submitted question runs rollout_pruning live inside the browser session."}, {"order": 5, "node": "decision", "action": "Real-time audits", "details": "Per-depth PruneDecisions rendered as stacked HTML diff cards with a compression summary."}]}, {"id": "environment-bootstrap", "name": "Credential Bootstrap & Defaults", "description": "How every entry point gets working credentials and sensible default models", "steps": [{"order": 1, "node": "package-api", "action": "Import library", "details": "Any entry point (notebook cell, CLI process) importing reasoning_pruning triggers package initialization."}, {"order": 2, "node": "config", "action": "Sync environment", "details": "init_environment scans standard .env locations and normalizes aliases (GEMINI_TOKEN -> GEMINI_API_KEY, HUGGINGFACE_TOKEN -> HF_TOKEN)."}, {"order": 3, "node": "local-artifacts", "action": "Supply credentials", "details": "Keys discovered in repo/.env or /content/.env via dotenv or a built-in fallback parser; never crashes when absent."}, {"order": 4, "node": "generation", "action": "Defaults resolved downstream", "details": "get_default_generator_model resolves google/gemma-4-12B-it; get_default_decision_model picks provider models by priority: gemini-2.5-flash -> gpt-4o-mini -> claude-3-5-haiku -> deepseek -> HF Qwen."}]}]};
    // ========== END DATA ==========

    // Color palette by group / type
    const GROUP_COLORS = {
      "Client Surfaces": "#58a6ff",
      "Package Interface": "#bc8cff",
      "Configuration & Contracts": "#f778ba",
      "Generation & Pruning Layer": "#3fb950",
      "Training Layer": "#ffa657",
      "Evaluation & Visualization": "#e3b341",
      "Data & Distribution": "#39c5cf",
      "External Services": "#8b949e",
      "Client": "#58a6ff", "Frontend": "#58a6ff", "API": "#3fb950",
      "Service": "#d2a8ff", "Core Services": "#d2a8ff",
      "Worker": "#ffa657", "Background": "#ffa657",
      "Data": "#79c0ff", "Storage": "#79c0ff", "Database": "#79c0ff",
      "Infra": "#8b949e", "Distribution": "#ffa657", "Build": "#ffa657"
    };
    const TYPE_FALLBACK = {
      client: "#58a6ff", frontend: "#58a6ff", api: "#3fb950",
      service: "#d2a8ff", function: "#d2a8ff", worker: "#ffa657",
      database: "#79c0ff", storage: "#79c0ff", queue: "#ffa657",
      external: "#8b949e", infra: "#8b949e", auth: "#f778ba", other: "#8b949e"
    };

    function colorFor(node) {
      return GROUP_COLORS[node.group] || TYPE_FALLBACK[node.type] || "#8b949e";
    }

    // Populate header
    document.getElementById("page-title").textContent = DATA.meta.title || "Architecture";
    document.getElementById("page-desc").textContent = DATA.meta.description || "";

    // Build vis nodes / edges
    const visNodes = new vis.DataSet(DATA.nodes.map(n => ({
      id: n.id,
      label: n.label,
      title: `<b>${n.label}</b><br>${n.type} · ${n.group}<br>${n.description || ""}${n.files && n.files.length ? "<br><br>Files: " + n.files.slice(0,4).join(", ") : ""}`,
      color: {
        background: colorFor(n),
        border: "#ffffff33",
        highlight: { background: colorFor(n), border: "#f0c14b" },
        hover: { background: colorFor(n), border: "#f0c14b" }
      },
      font: { color: "#0f1117", size: 13, face: "system-ui", bold: true },
      shape: "box",
      margin: 12,
      borderWidth: 1,
      borderWidthSelected: 3,
      group: n.group
    })));

    const visEdges = new vis.DataSet(DATA.edges.map((e, i) => ({
      id: e.id || `e${i}`,
      from: e.source,
      to: e.target,
      label: e.label || "",
      title: e.description || e.label || "",
      arrows: "to",
      color: { color: "#484f58", highlight: "#f0c14b", hover: "#8b949e" },
      font: { color: "#8b949e", size: 11, strokeWidth: 0, align: "middle" },
      smooth: { type: "cubicBezier", roundness: 0.4 }
    })));

    const container = document.getElementById("network");
    const network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, {
      physics: {
        enabled: true,
        solver: "forceAtlas2Based",
        forceAtlas2Based: { gravitationalConstant: -60, centralGravity: 0.01, springLength: 120, springConstant: 0.08 },
        stabilization: { iterations: 120 }
      },
      interaction: { hover: true, tooltipDelay: 120, hideEdgesOnDrag: false },
      nodes: { shape: "box" },
      edges: { width: 1.5, selectionWidth: 3 }
    });

    // Legend
    const groups = [...new Set(DATA.nodes.map(n => n.group))];
    const legendEl = document.getElementById("legend");
    groups.forEach(g => {
      const color = GROUP_COLORS[g] || "#8b949e";
      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${g}`;
      legendEl.appendChild(item);
    });

    // Flow list
    const flowList = document.getElementById("flow-list");
    let activeFlowId = null;

    DATA.flows.forEach(f => {
      const li = document.createElement("li");
      li.className = "flow-item";
      li.dataset.id = f.id;
      li.innerHTML = `${f.name}<span class="flow-desc">${f.description || ""}</span>`;
      li.addEventListener("click", () => selectFlow(f.id));
      flowList.appendChild(li);
    });

    document.getElementById("clear-btn").addEventListener("click", () => selectFlow(null));

    function selectFlow(flowId) {
      activeFlowId = flowId;
      document.querySelectorAll(".flow-item").forEach(el => {
        el.classList.toggle("active", el.dataset.id === flowId);
      });

      const stepsEl = document.getElementById("steps-content");
      if (!flowId) {
        network.unselectAll();
        visNodes.forEach(n => visNodes.update({ id: n.id, opacity: 1, borderWidth: 1 }));
        visEdges.forEach(e => visEdges.update({ id: e.id, color: { color: "#484f58", highlight: "#f0c14b" }, width: 1.5 }));
        stepsEl.innerHTML = `<p class="empty-steps">Select a flow to see the path through the system.</p>`;
        return;
      }

      const flow = DATA.flows.find(f => f.id === flowId);
      if (!flow) return;

      const pathNodeIds = new Set(flow.steps.map(s => s.node));
      const pathEdgeIds = new Set();

      // Find edges that connect consecutive steps
      for (let i = 0; i < flow.steps.length - 1; i++) {
        const a = flow.steps[i].node;
        const b = flow.steps[i + 1].node;
        const edge = DATA.edges.find(e =>
          (e.source === a && e.target === b) || (e.source === b && e.target === a)
        );
        if (edge) {
          const eid = edge.id || DATA.edges.indexOf(edge);
          // We need the vis edge id
          const visEdge = visEdges.get().find(ve => ve.from === a && ve.to === b || ve.from === b && ve.to === a);
          if (visEdge) pathEdgeIds.add(visEdge.id);
        }
      }

      // Update visuals
      visNodes.forEach(n => {
        const onPath = pathNodeIds.has(n.id);
        visNodes.update({
          id: n.id,
          opacity: onPath ? 1 : 0.25,
          borderWidth: onPath ? 3 : 1,
          color: {
            background: colorFor(DATA.nodes.find(dn => dn.id === n.id)),
            border: onPath ? "#f0c14b" : "#ffffff33",
            highlight: { background: colorFor(DATA.nodes.find(dn => dn.id === n.id)), border: "#f0c14b" }
          }
        });
      });

      visEdges.forEach(e => {
        const onPath = pathEdgeIds.has(e.id);
        visEdges.update({
          id: e.id,
          width: onPath ? 3.5 : 1,
          color: {
            color: onPath ? "#f0c14b" : "#30363d",
            highlight: "#f0c14b",
            opacity: onPath ? 1 : 0.3
          }
        });
      });

      // Focus the path
      network.fit({ nodes: [...pathNodeIds], animation: true });

      // Render steps
      stepsEl.innerHTML = flow.steps
        .sort((a, b) => a.order - b.order)
        .map(s => {
          const node = DATA.nodes.find(n => n.id === s.node);
          return `
            <div class="step">
              <div class="step-num">${s.order}</div>
              <div class="step-body">
                <strong>${node ? node.label : s.node} — ${s.action}</strong>
                <div class="details">${s.details || ""}</div>
              </div>
            </div>`;
        }).join("");
    }

    // Stabilize then stop physics for better interaction
    network.once("stabilizationIterationsDone", () => {
      network.setOptions({ physics: false });
    });
  </script>
